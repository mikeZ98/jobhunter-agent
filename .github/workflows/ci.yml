name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          # macOS runs the Apple Notes JXA compile test that skips elsewhere.
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      # Chromium for the real-browser autofill test (fills a form, asserts it is never submitted).
      - name: Install Chromium
        run: uv run playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      # No Ollama, no network services: boards and LLM inference are faked in the suite.
      - run: uv run pytest -ra

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jobhunter-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (non-root, CLI, headless Chromium)
        run: |
          test "$(docker run --rm --entrypoint id jobhunter-agent:ci -u)" = "10001"
          docker run --rm jobhunter-agent:ci --help
          docker run --rm --shm-size=1g --entrypoint python jobhunter-agent:ci -c \
            "from playwright.sync_api import sync_playwright as s; p = s().start(); p.chromium.launch().close(); p.stop()"
      - run: docker compose config --quiet
